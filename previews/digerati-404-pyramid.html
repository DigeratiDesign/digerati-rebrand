:root {

.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--diameter));
  gap: var(--gap);
}
.grid .cell {
  width: var(--diameter);
  height: var(--diameter);
  position: relative;
  border-radius: 50%;
  overflow: hidden;
  animation: pop 2s cubic-bezier(.19, 1, .22, 1) calc(var(--d) * .1s) both, pulse .8s ease-in-out calc(var(--d) * .1s) infinite alternate;
}
.grid .cell::before,
.grid .cell::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  --hx:0;
  --vy:0;
  animation: shrink .8s ease-in-out calc(var(--d) * .1s) infinite alternate;
  transform: translate(var(--hx), var(--vy)) scale(1);
}
.grid .cell::before {
  background: var(--disc-back);
  --hx:calc(-1 * var(--sep));
  --vy:calc(-1 * var(--vsep));
}
.grid .cell::after {
  background: var(--disc-front);
  --hx:var(--sep);
  --vy:var(--vsep);
